controller:
  image:
    tag: "lts-jdk17"
  serviceType: LoadBalancer
  installPlugins:
    - kubernetes:latest
    - git:latest
    - workflow-aggregator:latest
    - pipeline-stage-view:latest
    - configuration-as-code:latest
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2048Mi"

serviceAccount:
  create: true
  name: jenkins

rbac:
  create: true

persistence:
  enabled: false

agent:
  enabled: true